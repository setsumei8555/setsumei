
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>サルプレップ｜1日法の説明動画</title>

  <style>
    .salprep-video {
      width: 100%;
      box-sizing: border-box;
      margin: 0 auto;
      padding: 16px;
      color: #263238;
      font-family: sans-serif;
    }

    .salprep-video h1,
    .salprep-video h2 {
      margin-top: 8px;
      margin-bottom: 16px;
    }

    .salprep-video h1 {
      font-size: 28px;
    }

    .salprep-video h2 {
      font-size: 22px;
    }

    .salprep-video-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      padding: 20px;
      border: 0;
      border-radius: 12px;
      background: #176B87;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .salprep-video-button:hover {
      background: #12566d;
    }

    .salprep-video-button:focus-visible,
    .salprep-close-button:focus-visible {
      outline: 3px solid #F0A830;
      outline-offset: 3px;
    }

    /* 動画を中央に配置し、最大幅を960pxに制限 */
    .salprep-player {
      width: 100%;
      max-width: 960px;
      margin: 20px auto 0;
    }

    .salprep-player[hidden] {
      display: none;
    }

    /* 動画の縦横比を16:9に維持 */
    .salprep-player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #eaf0f3;
    }

    .salprep-player-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .salprep-close-button {
      display: block;
      margin: 16px auto 0;
      padding: 12px 24px;
      border: 1px solid #176B87;
      border-radius: 8px;
      background: #fff;
      color: #176B87;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .salprep-close-button:hover {
      background: #eef7fa;
    }

    /* スマートフォン向け */
    @media (max-width: 600px) {
      .salprep-video {
        padding: 12px;
      }

      .salprep-video h1 {
        font-size: 24px;
      }

      .salprep-video h2 {
        font-size: 19px;
      }

      .salprep-video-button {
        padding: 16px;
        font-size: 18px;
      }

      .salprep-player {
        margin-top: 16px;
      }
    }
  </style>
</head>

<body>

  <section class="salprep-video">
    <p>大腸内視鏡検査 前処置のご案内</p>
    <h1>サルプレップ</h1>
    <h2>1日法の説明動画</h2>

    <button
      type="button"
      id="salprepPlay"
      class="salprep-video-button"
      aria-expanded="false"
      aria-controls="salprepPlayer">
      ▶ 動画を見る
    </button>

    <div id="salprepPlayer"
         class="salprep-player"
         hidden>

      <div class="salprep-player-frame">
        <iframe
          src="https://drive.google.com/file/d/1k62bBcJn9yEHMSwqtgKBALa3OZ56-AGJ/preview"
          title="サルプレップ 1日法の説明動画"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      </div>

      <button
        type="button"
        id="salprepClose"
        class="salprep-close-button">
        動画を閉じる
      </button>
    </div>
  </section>

  <script>
    const playButton = document.getElementById("salprepPlay");
    const player = document.getElementById("salprepPlayer");
    const closeButton = document.getElementById("salprepClose");
    const iframe = player.querySelector("iframe");
    const originalSrc = iframe.src;

    playButton.addEventListener("click", () => {
      player.hidden = false;
      playButton.hidden = true;
      playButton.setAttribute("aria-expanded", "true");

      player.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

    closeButton.addEventListener("click", () => {
      // iframeを再読み込みして動画を停止
      iframe.src = originalSrc;

      player.hidden = true;
      playButton.hidden = false;
      playButton.setAttribute("aria-expanded", "false");

      playButton.focus();
    });
  </script>

</body>
</html>
